<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; padding: 15px; font-size: 14px; overflow: hidden; line-height: 1.2; }
        #console { white-space: pre; }
        .green { color: #00ff00; }
        .red { color: #ff0000; }
        .yellow { color: #ffff00; }
        .purple { color: #ff00ff; }
    </style>
</head>
<body>
    <div id="console"></div>
    <script>
        const consoleDiv = document.getElementById('console');
        let lines = [];

        function update() {
            const valorCarteira = Math.floor(Math.random() * (40 - 30 + 1) + 30);
            const status = [
                `<span class="green">Eth: Mining BTC/ETC successful - Share accepted</span>`,
                `<span class="red">Error: GPU driver timeout on GPU3 - Retrying...</span>`,
                `<span class="yellow">GPU: Samsung Evo RX580 OC | Temp: 55C | Fan: 70%</span>`,
                `<span class="purple">New deposit received: ${valorCarteira}.00 USD to wallet</span>`
            ];
            
            lines.push(status[Math.floor(Math.random() * status.length)]);
            if (lines.length > 22) lines.shift();
            
            consoleDiv.innerHTML = lines.join('\n');
            window.scrollTo(0, document.body.scrollHeight);
        }

        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
