<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; padding: 15px; font-size: 14px; }
        .green { color: #00ff00; }
        .purple { color: #ff00ff; }
        #logs { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="logs"></div>
    <script>
        // COLE O LINK DA SUA PLANILHA AQUI:
        const url = "https://docs.google.com/spreadsheets/d/1ZOSmfMgjJrHfZPODK1ub-lQyORd_1ghzgi9VbzvfnFQ/edit?usp=drivesdk";

        async function lerPlanilha() {
            const resposta = await fetch(url);
            const texto = await resposta.text();
            // Lógica simples para extrair os valores da planilha
            document.getElementById('logs').innerHTML = `<div class="green">Ganho Atual: ${texto.split(',')[1]} USD</div>`;
        }
        setInterval(lerPlanilha, 5000);
    </script>
</body>
</html>
